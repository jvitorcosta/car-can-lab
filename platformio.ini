[platformio]
default_envs = sniff

[env]
monitor_speed = 115200

; ESP32-2432S028R "Cheap Yellow Display" (the yellow deck). The TFT flags are the deck repo's
; ([common] + [cyd] in spotify-pokemon-deck platformio.ini), so the screen looks the same.
[cyd]
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
monitor_filters = esp32_exception_decoder
; Deck compatibility rule (README): the LED panel's table, two 1.9 MB OTA slots + a ~128 KB data
; partition (LittleFS, the recordings). Never change it, or sniff_ota and the deck repo's
; ledpanel_ota can't replace each other over WiFi.
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
extra_scripts =
    ; firmware version from the git tag -> include/fw_version.h (git-ignored)
    pre:tools/version.py
; lib/xboxpad is asukiaaa's Xbox library vendored (its own dependencies listed here)
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    asukiaaa/XboxControllerNotificationParser@1.0.5
    asukiaaa/XboxSeriesXHIDReportBuilder_asukiaaa@1.0.1
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=1
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RST=-1
    -D TFT_BACKLIGHT_ON=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
    -D SPI_READ_FREQUENCY=20000000
    -D USE_HSPI_PORT=1
    -D BOARD_CYD=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_BL=21
    -D SPI_FREQUENCY=55000000
    ; the deck's address on the iPhone hotspot: 172.20.10.11 (net/wifi, util/hotspotip)
    -D CARDECK_COMPANION=1
    ; TFT_eSPI's GFX free fonts: VT323 (src/fonts, ui/termfont) draws through setFreeFont
    -D LOAD_GFXFF=1
build_unflags = -std=gnu++11
build_src_flags = -Wall -Wextra -Wshadow -Wdouble-promotion -Wlogical-op -Wduplicated-cond
    -Wnull-dereference -Wformat=2 -Werror

; The sniff firmware over USB (the first time, or to recover):
;   pio run -e sniff -t upload
[env:sniff]
extends = cyd

; The sniff firmware over WiFi, from a PC on the iPhone hotspot, onto a deck running either the
; LED panel or sniff (both listen at 172.20.10.11 with the same OTA_PASSWORD, tools/ota_auth.py).
;   pio run -e sniff_ota -t upload
; The deck repo's  pio run -e ledpanel_ota -t upload  puts the LED panel back the same way.
[env:sniff_ota]
extends = env:sniff
upload_protocol = espota
upload_port = 172.20.10.11
extra_scripts =
    ${cyd.extra_scripts}
    post:tools/ota_auth.py

[env:native]
platform = native
test_framework = unity
; Host tests live in test/ and #include the pure modules from src/ directly. This env mainly
; fetches Unity into .pio/libdeps/native; tools/run_tests.ps1 compiles each suite with g++.
build_flags = -std=gnu++17 -D UNIT_TEST
lib_deps = throwtheswitch/Unity@2.6.0
